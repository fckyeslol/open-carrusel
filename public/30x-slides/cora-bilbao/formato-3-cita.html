<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0F2634;font-family:'Poppins',sans-serif}
/* Textura de foto muy tenue detrás + wash petróleo + glow del degradé naranja→magenta */
.tex{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%;opacity:.18;filter:grayscale(.2)}
.wash{position:absolute;inset:0;background:
  radial-gradient(56% 42% at 50% 36%, rgba(254,113,41,.22), rgba(254,113,41,0) 62%),
  radial-gradient(48% 38% at 78% 88%, rgba(176,0,184,.20), rgba(176,0,184,0) 66%),
  linear-gradient(180deg, rgba(15,38,52,.88), rgba(15,38,52,.72) 45%, rgba(15,38,52,.96))}
.logo{position:absolute;top:66px;left:70px;height:40px;width:auto;filter:brightness(0) invert(1)}
.idx{position:absolute;top:74px;right:74px;font-family:'Playfair Display',serif;font-size:40px;color:#FE7129}
.mark{position:absolute;top:198px;left:0;right:0;text-align:center;font-family:'Playfair Display',serif;font-weight:700;font-size:290px;line-height:.6;color:#FE7129;opacity:.9}
.quote{position:absolute;top:492px;left:92px;right:92px;text-align:center;font-family:'Playfair Display',serif;font-weight:500;font-size:76px;line-height:1.18;letter-spacing:-.5px;color:#F6F5F0}
.quote .em{font-style:italic;font-weight:600;color:#FE7129}
.divider{position:absolute;top:970px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:20px}
.divider .line{width:120px;height:2px;background:rgba(246,245,240,.32)}
.divider .dot{width:12px;height:12px;transform:rotate(45deg);background:#B000B8}
.name{position:absolute;top:1052px;left:0;right:0;text-align:center;font-size:32px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#F6F5F0}
.role{position:absolute;top:1110px;left:0;right:0;text-align:center;font-size:23px;font-weight:500;color:#C8D2D9}
</style></head><body>
<div class="s">
  <img class="tex" src="/uploads/30x/cora-bilbao/hero.jpg" alt="">
  <div class="wash"></div>
  <img class="logo" src="/uploads/brand/30x-blanco.png" alt="30X">
  <div class="idx">03</div>
  <div class="mark">&ldquo;</div>
  <div class="quote">Si hay que explicarlo<br>dos veces, el problema<br>no es <span class="em">quien escucha.</span></div>
  <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  <div class="name">Cora Bilbao</div>
  <div class="role">30X Executive Education</div>
</div>
</body></html>
