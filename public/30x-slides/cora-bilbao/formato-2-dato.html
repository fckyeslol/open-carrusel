<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#F6F5F0;font-family:'Poppins',sans-serif;color:#143043}
/* Profundidad: glow naranja arriba-derecha + halo magenta sangrando abajo-izq */
.glow{position:absolute;top:-170px;right:-170px;width:780px;height:780px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(254,113,41,.30), rgba(254,113,41,0) 66%)}
.blob{position:absolute;bottom:-250px;left:-230px;width:680px;height:680px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(176,0,184,.18), rgba(176,0,184,0) 64%)}
.logo{position:absolute;top:66px;left:70px;height:40px;width:auto}
.idx{position:absolute;top:74px;right:74px;font-family:'Playfair Display',serif;font-size:40px;color:#FE7129}
.kicker{position:absolute;top:170px;left:72px;font-size:23px;font-weight:700;letter-spacing:4.5px;text-transform:uppercase;color:#B000B8;display:flex;align-items:center;gap:18px}
.kicker::before{content:'';width:52px;height:3px;background:#FE7129;display:inline-block}
.lead{position:absolute;top:238px;left:70px;right:150px;font-family:'Playfair Display',serif;font-weight:500;font-size:58px;line-height:1.08;color:#143043}
.num{position:absolute;top:406px;left:50px;font-family:'Playfair Display',serif;font-weight:700;font-size:480px;line-height:.8;color:#143043;letter-spacing:-10px}
.num .pct{color:#FE7129;font-size:270px;vertical-align:baseline}
.bar{position:absolute;top:912px;left:74px;width:380px;height:13px;border-radius:7px;background:#FE7129}
.body{position:absolute;top:968px;left:72px;right:150px;font-size:34px;line-height:1.42;font-weight:500;color:#3C5364}
.body b{font-weight:700;color:#143043}
.src{position:absolute;bottom:150px;left:74px;right:120px;font-size:22px;font-weight:600;color:#74838D;display:flex;align-items:center;gap:16px}
.src::before{content:'';width:40px;height:2px;background:#B000B8;display:inline-block}
.sign{position:absolute;bottom:78px;left:72px;font-family:'Playfair Display',serif;font-style:italic;font-size:36px;color:#143043}
</style></head><body>
<div class="s">
  <div class="glow"></div>
  <div class="blob"></div>
  <img class="logo" src="/uploads/brand/30x-negro.png" alt="30X">
  <div class="idx">02</div>
  <div class="kicker">El número que nadie mira</div>
  <div class="lead">De todo lo que decís en una<br>reunión, se recuerda apenas:</div>
  <div class="num">20<span class="pct">%</span></div>
  <div class="bar"></div>
  <div class="body">y casi siempre es lo que dijiste <b>primero</b>. Todo lo que agregás después compite con tu propia idea.</div>
  <div class="src">Lectura de Cora Bilbao · 30X Executive Education</div>
  <div class="sign">/ Cora Bilbao.</div>
</div>
</body></html>
